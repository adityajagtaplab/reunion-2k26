<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>All Responses — Reunion 2k26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F7F0DE;
    --paper: #FFFBF2;
    --maroon: #7A2E2E;
    --maroon-dark: #5C2020;
    --mustard: #D9A441;
    --ink: #2E2A24;
    --line: #D8CBA8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--cream);
    background-image: repeating-linear-gradient(0deg, transparent, transparent 27px, var(--line) 28px);
    font-family: 'Poppins', sans-serif;
    color: var(--ink);
    padding: 24px 16px;
    display: flex;
    justify-content: center;
  }

  .container {
    width: 100%;
    max-width: 600px;
  }

  .header {
    text-align: center;
    margin-bottom: 16px;
  }

  h1 {
    font-family: 'Permanent Marker', cursive;
    color: var(--maroon);
    font-size: 28px;
    margin: 10px 0;
  }

  .badge {
    background: var(--mustard);
    color: var(--maroon);
    font-family: 'Permanent Marker', cursive;
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 50px;
  }

  /* Horizontal Question Navigation Strip */
  .strip-wrapper {
    width: 100%;
    margin-bottom: 16px;
    overflow-x: auto;
    white-space: nowrap;
    display: flex;
    gap: 8px;
    padding: 4px 2px 8px 2px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    position: sticky;
    top: 0;
    background: var(--cream);
    z-index: 10;
  }

  .strip-wrapper::-webkit-scrollbar {
    display: none;
  }

  .q-pill {
    flex: 0 0 auto;
    padding: 6px 14px;
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 2px 2px 0 var(--line);
  }

  .q-pill:active {
    background: var(--maroon);
    color: #fff;
  }

  .q-card {
    background: var(--paper);
    border: 2px solid var(--maroon);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 20px;
    box-shadow: 4px 4px 0 var(--mustard);
    scroll-margin-top: 60px;
  }

  .q-title {
    font-weight: 700;
    font-size: 16px;
    color: var(--maroon);
    margin-bottom: 12px;
    border-bottom: 2px dashed var(--line);
    padding-bottom: 8px;
  }

  .response-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .response-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    font-size: 14px;
  }

  .player-name {
    font-weight: 600;
    color: var(--ink);
  }

  .selected-option {
    background: #f0e6d2;
    color: var(--maroon);
    padding: 2px 8px;
    border-radius: 6px;
    font-weight: 500;
    font-size: 13px;
  }
</style>
</head>
<body>

  <div class="container">
    <div class="header">
      <span class="badge">REUNION 2K26</span>
      <h1>📊 ALL RESPONSES 📊</h1>
    </div>

    <!-- Navigation Strip -->
    <div class="strip-wrapper" id="questionStrip"></div>

    <div id="detailsContainer">
      <p style="text-align:center;">Loading... ⏳</p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs } 
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCePBzR9A533G67wycWgGRluEu1wMGujYg",
      authDomain: "reunion-2k26.firebaseapp.com",
      projectId: "reunion-2k26",
      storageBucket: "reunion-2k26.firebasestorage.app",
      messagingSenderId: "982280621446",
      appId: "1:982280621446:web:851f2d3e55b854ad077007"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadAllDetails() {
      const container = document.getElementById('detailsContainer');
      const stripContainer = document.getElementById('questionStrip');

      const qSnap = await getDocs(collection(db, "questions"));
      const vSnap = await getDocs(collection(db, "votes"));
      const pSnap = await getDocs(collection(db, "players"));

      // 1. Map Player IDs to Real Names
      let playerNames = {};
      pSnap.forEach(d => {
        playerNames[d.id] = d.data().name;
      });

      let questions = [];
      qSnap.forEach(d => questions.push({ id: d.id, ...d.data() }));

      // Sort questions based on the 'order' field
      questions.sort((a, b) => (a.order || 0) - (b.order || 0));

      let votesDocs = [];
      vSnap.forEach(d => {
        let rawId = d.id;
        let data = d.data();
        votesDocs.push({ 
          playerId: rawId, 
          playerName: playerNames[rawId] || data.playerName || data.name || rawId, 
          answers: data.answers || {} 
        });
      });

      container.innerHTML = '';
      stripContainer.innerHTML = '';

      if(questions.length === 0) {
        container.innerHTML = '<p style="text-align:center;">Questions are not found!</p>';
        return;
      }

      // 2. Render Navigation Strip & Questions List
      questions.forEach((q, index) => {
        const qId = `q_card_${index}`;

        // Add Pill to Strip
        const pill = document.createElement('div');
        pill.className = 'q-pill';
        pill.textContent = `Q${index + 1}`;
        pill.onclick = () => {
          const cardEl = document.getElementById(qId);
          if (cardEl) {
            cardEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        };
        stripContainer.appendChild(pill);

        // Render Question Card
        const qCard = document.createElement('div');
        qCard.className = 'q-card';
        qCard.id = qId;

        let responsesHTML = '';

        votesDocs.forEach(v => {
          let selectedVal = v.answers[q.id];
          if(selectedVal) {
            // Convert choice ID to name if player was selected
            let choiceText = playerNames[selectedVal] || selectedVal.replace(/^custom_\d+_/, '');
            responsesHTML += `
              <div class="response-item">
                <span class="player-name">${v.playerName}</span>
                <span class="selected-option">${choiceText}</span>
              </div>
            `;
          }
        });

        if(!responsesHTML) {
          responsesHTML = '<div style="font-size: 13px; color: #888;">No votes for this!</div>';
        }

        qCard.innerHTML = `
          <div class="q-title">Q${index + 1}. ${q.text}</div>
          <div class="response-list">
            ${responsesHTML}
          </div>
        `;

        container.appendChild(qCard);
      });
    }

    loadAllDetails();
  </script>
</body>
</html>
