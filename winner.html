<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Winners — Reunion 2k26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F7F0DE;
    --paper: #FFFBF2;
    --maroon: #7A2E2E;
    --maroon-dark: #5C2020;
    --mustard: #D9A441;
    --ink: #2E2A24;
    --line: #D8CBA8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--cream);
    background-image: repeating-linear-gradient(0deg, transparent, transparent 27px, var(--line) 28px);
    font-family: 'Poppins', sans-serif;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--paper);
    border: 3px solid var(--maroon);
    border-radius: 18px;
    padding: 26px 22px 24px;
    position: relative;
    box-shadow: 6px 6px 0 var(--mustard);
    text-align: center;
  }

  h1 {
    font-family: 'Permanent Marker', cursive;
    color: var(--maroon);
    font-size: 32px;
    margin: 10px 0 6px;
  }

  .locked-msg {
    font-size: 15px;
    color: #6B6354;
    margin: 20px 0;
  }

  .result-box {
    text-align: left;
    margin-top: 15px;
    max-height: 380px;
    overflow-y: auto;
  }

  .winner-card {
    background: #fff;
    border: 2px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .rank-1 { border: 2px solid #D9A441; background: #FFFDF5; }
  .rank-2 { border: 2px solid #A0A0A0; background: #F8F8F8; }
  .rank-3 { border: 2px solid #CD7F32; background: #FAFFFC; }

  .rank-badge {
    font-size: 24px;
    margin-right: 12px;
  }

  .player-info {
    flex-grow: 1;
  }

  .player-name {
    font-weight: 700;
    font-size: 16px;
    color: var(--maroon-dark);
  }

  .score-badge {
    font-family: 'Permanent Marker', cursive;
    background: var(--maroon);
    color: #fff;
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 14px;
  }

  .badge {
    background: var(--mustard);
    color: var(--maroon-dark);
    font-family: 'Permanent Marker', cursive;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 50px;
  }
</style>
</head>
<body>

  <div class="card">
    <span class="badge">REUNION 2K26</span>
    <h1>🏆 TOP 3 WINNERS 🏆</h1>

    <div id="lockState">
      <div style="font-size: 50px; margin: 15px 0;">🤫🔒</div>
      <p class="locked-msg">The results are not out yet!<br><b>The results will be dropped live at the reunion!</b></p>
    </div>

    <div id="resultState" style="display: none;">
      <div class="result-box" id="resultsContainer">
        <!-- Top 3 Winners Load Here -->
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, getDocs } 
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCePBzR9A533G67wycWgGRluEu1wMGujYg",
      authDomain: "reunion-2k26.firebaseapp.com",
      projectId: "reunion-2k26",
      storageBucket: "reunion-2k26.firebasestorage.app",
      messagingSenderId: "982280621446",
      appId: "1:982280621446:web:851f2d3e55b854ad077007"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function checkStatus() {
      const configSnap = await getDoc(doc(db, "config", "Settings"));
      const isPublished = configSnap.exists() && configSnap.data().showWinners === true;

      if (isPublished) {
        document.getElementById('lockState').style.display = 'none';
        document.getElementById('resultState').style.display = 'block';
        calculateTop3Winners();
      }
    }

    async function calculateTop3Winners() {
      const container = document.getElementById('resultsContainer');
      container.innerHTML = '<p style="text-align:center;">Counting... ⏳</p>';

      const qSnap = await getDocs(collection(db, "questions"));
      const vSnap = await getDocs(collection(db, "votes"));
      const pSnap = await getDocs(collection(db, "players"));

      // 1. Player ID -> Real Name mapping
      let playerNames = {};
      pSnap.forEach(d => {
        playerNames[d.id] = d.data().name;
      });

      let questions = [];
      qSnap.forEach(d => questions.push({ id: d.id, ...d.data() }));

      let votesDocs = [];
      vSnap.forEach(d => {
        let rawId = d.id;
        let data = d.data();
        votesDocs.push({ 
          playerId: rawId, 
          playerName: data.playerName || data.name || playerNames[rawId] || rawId, 
          answers: data.answers || {} 
        });
      });

      // 2. Majority Answer for each Question
      let rightAnswers = {};
      questions.forEach(q => {
        let tally = {};
        votesDocs.forEach(v => {
          let ans = v.answers[q.id];
          if (ans) {
            tally[ans] = (tally[ans] || 0) + 1;
          }
        });

        let majorityAns = null;
        let maxCount = 0;
        for (let ansKey in tally) {
          if (tally[ansKey] > maxCount) {
            maxCount = tally[ansKey];
            majorityAns = ansKey;
          }
        }
        rightAnswers[q.id] = majorityAns;
      });

      // 3. Calculate Scores
      let playerScores = [];
      votesDocs.forEach(v => {
        let score = 0;
        for (let qId in rightAnswers) {
          if (v.answers[qId] && v.answers[qId] === rightAnswers[qId]) {
            score++;
          }
        }
        
        let displayName = playerNames[v.playerId] || v.playerName;
        playerScores.push({ name: displayName, score: score });
      });

      // Sort by Score
      playerScores.sort((a, b) => b.score - a.score);

      // 4. Display
      container.innerHTML = '';
      if (playerScores.length === 0) {
        container.innerHTML = '<p style="text-align:center;">The votes arent in yet.</p>';
        return;
      }

      const rankIcons = ['🥇', '🥈', '🥉'];
      const topWinners = playerScores.slice(0, 3);

      topWinners.forEach((p, index) => {
        const div = document.createElement('div');
        div.className = `winner-card rank-${index + 1}`;
        div.innerHTML = `
          <div class="rank-badge">${rankIcons[index]}</div>
          <div class="player-info">
            <div class="player-name">${p.name}</div>
            <div style="font-size: 12px; color: #666;">Rank ${index + 1}</div>
          </div>
          <div class="score-badge">${p.score} Pts</div>
        `;
        container.appendChild(div);
      });
    }

    checkStatus();
  </script>
</body>
</html>
